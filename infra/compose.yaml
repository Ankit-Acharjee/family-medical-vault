name: family-medical-vault-dev

services:
  postgres:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: fmv_owner
      POSTGRES_DB: fmv_dev
      POSTGRES_PASSWORD: ${LOCAL_DB_OWNER_PASSWORD:?Run pnpm local:setup first}
      FMV_APP_PASSWORD: ${LOCAL_DB_APP_PASSWORD:?Run pnpm local:setup first}
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_min_messages=fatal
      - -c
      - log_error_verbosity=terse
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/001-runtime-role.sh:/docker-entrypoint-initdb.d/001-runtime-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fmv_owner -d fmv_dev']
      interval: 2s
      timeout: 3s
      retries: 30
    # Database is reachable only within this Compose network; no host port.

  migrate:
    image: family-medical-vault-tooling:local
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: tooling
    environment:
      DATABASE_MIGRATION_URL: postgresql://fmv_owner:${LOCAL_DB_OWNER_PASSWORD}@postgres:5432/fmv_dev?schema=fmv
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../apps/server/prisma:/workspace/apps/server/prisma:ro
    command: [pnpm, --filter, '@fmv/server', db:migrate]

  api:
    image: family-medical-vault-api:local
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: runtime
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://fmv_app:${LOCAL_DB_APP_PASSWORD}@postgres:5432/fmv_dev?schema=fmv
    ports:
      - '127.0.0.1:${LOCAL_API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  migration-dev:
    image: family-medical-vault-tooling:local
    profiles: [tools]
    environment:
      DATABASE_MIGRATION_URL: postgresql://fmv_owner:${LOCAL_DB_OWNER_PASSWORD}@postgres:5432/fmv_dev?schema=fmv
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../apps/server/prisma:/workspace/apps/server/prisma
    working_dir: /workspace/apps/server
    command: [pnpm, db:status]

  db-tests:
    image: family-medical-vault-tooling:local
    profiles: [test]
    environment:
      TEST_DATABASE_URL: postgresql://fmv_owner:${LOCAL_DB_OWNER_PASSWORD}@postgres:5432/fmv_dev?schema=fmv
      TEST_RUNTIME_URL: postgresql://fmv_app:${LOCAL_DB_APP_PASSWORD}@postgres:5432/fmv_dev?schema=fmv
    depends_on:
      postgres:
        condition: service_healthy
    command: [pnpm, --filter, '@fmv/server', test:db]

volumes:
  postgres-data:
